[project]
name = "analyze-git-repo-loc"
version = "3.3.0"
description = "Analyze Git repositories and visualize code LOC."
readme = "README.md"
requires-python = ">=3.14"
license = { file = "LICENSE" }
authors = [{ name = "Nob Shinjo" }]
scripts = { analyze-git-repo-loc = "analyze_git_repo_loc.__main__:main" }
dependencies = [
"pandas>=3.1.1",
"plotly>=7.1.0",
"tqdm>=4.70.1",
"jinja2>=3.1.6",
"PyDriller>=2.12",
"PyYAML>=6.0.3",
"pip-licenses>=5.5.5",
"prompt_toolkit>=3.0.53",
"GitPython>=3.2.1",
"colorama>=0.4.6",
]

[dependency-groups]
dev = ["pytest>=9.2.0"]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling>=1.33.0,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["analyze_git_repo_loc"]

[tool.hatch.build.targets.sdist]
include = ["/analyze_git_repo_loc", "/tests", "/pyproject.toml", "/uv.lock", "/README.md", "/LICENSE"]
