readme = "README.md"
requires-python = ">=3.14"
license = { file = "LICENSE" }
authors = [{ name = "Nob Shinjo" }]
dependencies = [
"pandas>=3.1.1",
"plotly>=7.1.0",
"tqdm>=4.70.1",
"jinja2>=3.1.6",
"PyDriller>=2.12",
"PyYAML>=6.0.3",
"pip-licenses>=5.5.5",
"prompt_toolkit>=3.0.53",
